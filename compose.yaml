name: taskbound-agent-data-gateway

services:
  control-postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: ${CONTROL_POSTGRES_DB:-taskbound_gateway}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${CONTROL_POSTGRES_ADMIN_PASSWORD:?set CONTROL_POSTGRES_ADMIN_PASSWORD in .env}
      CONTROL_DB_PASSWORD: ${CONTROL_DB_PASSWORD:?set CONTROL_DB_PASSWORD in .env}
    ports:
      - 127.0.0.1:${CONTROL_POSTGRES_PORT:-25433}:5432
    volumes:
      - control-pg-data:/var/lib/postgresql/data
      - ./db/control-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    networks:
      - control-plane

  business-postgres:
    # PostgreSQL 16 with pgvector: the Knowledge Product source relations
    # (db/init/kb-schema.psql) need the vector extension. Research overlays
    # may pin a plain postgres image; 30-kb-schema.sh then skips the schema.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-travel_demo}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD:?set GATEWAY_DB_PASSWORD in .env}
      KB_REQUIRE_PGVECTOR: "1"
    volumes:
      - business-pg-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      # db/init/07b-final-v5-benchmark-dataset.sh runs the exact contract-indexed
      # generator bytes from this read-only mount, so a deployment cannot drift
      # away from evaluation/final-v5-wsl2/contracts/index-v1.json.
      - ./evaluation/final-v5-wsl2/sql/datasets:/opt/taskgate/final-v5-sql:ro
    healthcheck:
      # Probe over TCP, not the local socket. During initdb the entrypoint runs
      # a temporary socket-only server, so a socket probe reports healthy while
      # db/init is still creating the Final-V5 benchmark corpus and dependent
      # services race ahead into a refused connection.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 60
    security_opt:
      - no-new-privileges:true
    networks:
      - business-data

  snapshot-index-detail:
    build:
      context: .
      args:
        TARGET: snapshot-index
    command:
      - -input
      - /input/expense-detail-v1.json
      - -output-dir
      - /data/snapshot-index
      - -allow-existing-identical
    environment:
      SNAPSHOT_POSTGRES_DSN: postgres://gateway_reader:${GATEWAY_DB_PASSWORD:?set GATEWAY_DB_PASSWORD in .env}@business-postgres:5432/${POSTGRES_DB:-travel_demo}?sslmode=disable
    depends_on:
      business-postgres:
        condition: service_healthy
    volumes:
      - ./config/snapshots/expense-detail-v1.json:/input/expense-detail-v1.json:ro
      - snapshot-index-artifacts:/data/snapshot-index
    read_only: true
    mem_limit: 4g
    restart: "no"
    security_opt:
      - no-new-privileges:true
    networks:
      - business-data

  snapshot-index-summary:
    build:
      context: .
      args:
        TARGET: snapshot-index
    command:
      - -input
      - /input/expense-summary-v1.json
      - -input
      - /input/provsql-orders-v1.json
      - -input
      - /input/provsql-lineitem-v1.json
      - -input
      - /input/provsql-nonce-v1.json
      - -output-dir
      - /data/snapshot-index
      - -allow-existing-identical
    environment:
      SNAPSHOT_POSTGRES_DSN: postgres://gateway_reader:${GATEWAY_DB_PASSWORD:?set GATEWAY_DB_PASSWORD in .env}@business-postgres:5432/${POSTGRES_DB:-travel_demo}?sslmode=disable
    depends_on:
      business-postgres:
        condition: service_healthy
      snapshot-index-detail:
        condition: service_completed_successfully
    volumes:
      - ./config/snapshots/expense-summary-v1.json:/input/expense-summary-v1.json:ro
      - ./config/snapshots/provsql-orders-v1.json:/input/provsql-orders-v1.json:ro
      - ./config/snapshots/provsql-lineitem-v1.json:/input/provsql-lineitem-v1.json:ro
      - ./config/snapshots/provsql-nonce-v1.json:/input/provsql-nonce-v1.json:ro
      - snapshot-index-artifacts:/data/snapshot-index
    read_only: true
    mem_limit: 4g
    restart: "no"
    security_opt:
      - no-new-privileges:true
    networks:
      - business-data

  # The Final-V5 result-heavy Publication compiles 100,000 rows over sixteen
  # fields, so it gets its own offline compiler with a larger ceiling instead of
  # raising the limit of the existing publications. This is a build-time
  # compiler, not a governed runtime component: the Gateway carries its own
  # separate cgroup ceiling, which is what the memory evidence is about.
  snapshot-index-result-heavy:
    build:
      context: .
      args:
        TARGET: snapshot-index
    command:
      - -input
      - /input/final-v5-result-heavy-v1.json
      - -output-dir
      - /data/snapshot-index
      - -allow-existing-identical
    environment:
      SNAPSHOT_POSTGRES_DSN: postgres://gateway_reader:${GATEWAY_DB_PASSWORD:?set GATEWAY_DB_PASSWORD in .env}@business-postgres:5432/${POSTGRES_DB:-travel_demo}?sslmode=disable
    depends_on:
      business-postgres:
        condition: service_healthy
      snapshot-index-summary:
        condition: service_completed_successfully
    volumes:
      - ./config/snapshots/final-v5-result-heavy-v1.json:/input/final-v5-result-heavy-v1.json:ro
      - snapshot-index-artifacts:/data/snapshot-index
    read_only: true
    mem_limit: 16g
    restart: "no"
    security_opt:
      - no-new-privileges:true
    networks:
      - business-data

  # The Final-V5 exposure-scale Publication compiles all 414,000 immutable
  # rows into the shared artifact volume. Keep it separate from result-heavy so
  # each large compiler has an explicit resource ceiling and completion gate.
  snapshot-index-exposure-scale:
    build:
      context: .
      args:
        TARGET: snapshot-index
    command:
      - -input
      - /input/final-v5-exposure-scale-v1.json
      - -output-dir
      - /data/snapshot-index
      - -allow-existing-identical
    environment:
      SNAPSHOT_POSTGRES_DSN: postgres://gateway_reader:${GATEWAY_DB_PASSWORD:?set GATEWAY_DB_PASSWORD in .env}@business-postgres:5432/${POSTGRES_DB:-travel_demo}?sslmode=disable
    depends_on:
      business-postgres:
        condition: service_healthy
      snapshot-index-result-heavy:
        condition: service_completed_successfully
    volumes:
      - ./config/snapshots/final-v5-exposure-scale-v1.json:/input/final-v5-exposure-scale-v1.json:ro
      - snapshot-index-artifacts:/data/snapshot-index
    read_only: true
    mem_limit: 16g
    restart: "no"
    security_opt:
      - no-new-privileges:true
    networks:
      - business-data

  # The P9.E scale-point Publication compiles 625,000 immutable rows
  # (10,000,000 cell facts) into the shared artifact volume, sequenced after
  # exposure-scale so the large compilers never run concurrently.
  snapshot-index-scale-e7:
    build:
      context: .
      args:
        TARGET: snapshot-index
    command:
      - -input
      - /input/final-v5-scale-e7-v1.json
      - -output-dir
      - /data/snapshot-index
      - -allow-existing-identical
    environment:
      SNAPSHOT_POSTGRES_DSN: postgres://gateway_reader:${GATEWAY_DB_PASSWORD:?set GATEWAY_DB_PASSWORD in .env}@business-postgres:5432/${POSTGRES_DB:-travel_demo}?sslmode=disable
      # The compiler holds the whole relation in memory and Go's GC has no
      # cgroup awareness; without a soft limit the heap grows to the memcg
      # ceiling and the OOM killer fires before a collection does.
      GOMEMLIMIT: 17GiB
    depends_on:
      business-postgres:
        condition: service_healthy
      snapshot-index-exposure-scale:
        condition: service_completed_successfully
    volumes:
      - ./config/snapshots/final-v5-scale-e7-v1.json:/input/final-v5-scale-e7-v1.json:ro
      - snapshot-index-artifacts:/data/snapshot-index
    read_only: true
    mem_limit: 24g
    restart: "no"
    security_opt:
      - no-new-privileges:true
    networks:
      - business-data

  snapshot-sidecar-install:
    build:
      context: .
      args:
        TARGET: snapshot-sidecar-install
    command:
      - -artifact-dir
      - /data/snapshot-index
      - -input
      - /input/expense-detail-v1.json
      - -input
      - /input/expense-summary-v1.json
      - -input
      - /input/provsql-orders-v1.json
      - -input
      - /input/provsql-lineitem-v1.json
      - -input
      - /input/provsql-nonce-v1.json
      - -input
      - /input/final-v5-result-heavy-v1.json
      - -input
      - /input/final-v5-exposure-scale-v1.json
      - -input
      - /input/final-v5-scale-e7-v1.json
    environment:
      SNAPSHOT_INSTALL_POSTGRES_DSN: postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@business-postgres:5432/${POSTGRES_DB:-travel_demo}?sslmode=disable
    depends_on:
      business-postgres:
        condition: service_healthy
      snapshot-index-scale-e7:
        condition: service_completed_successfully
    volumes:
      - ./config/snapshots/expense-detail-v1.json:/input/expense-detail-v1.json:ro
      - ./config/snapshots/expense-summary-v1.json:/input/expense-summary-v1.json:ro
      - ./config/snapshots/provsql-orders-v1.json:/input/provsql-orders-v1.json:ro
      - ./config/snapshots/provsql-lineitem-v1.json:/input/provsql-lineitem-v1.json:ro
      - ./config/snapshots/provsql-nonce-v1.json:/input/provsql-nonce-v1.json:ro
      - ./config/snapshots/final-v5-result-heavy-v1.json:/input/final-v5-result-heavy-v1.json:ro
      - ./config/snapshots/final-v5-exposure-scale-v1.json:/input/final-v5-exposure-scale-v1.json:ro
      - ./config/snapshots/final-v5-scale-e7-v1.json:/input/final-v5-scale-e7-v1.json:ro
      - snapshot-index-artifacts:/data/snapshot-index:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    mem_limit: 16g
    restart: "no"
    security_opt:
      - no-new-privileges:true
    networks:
      - business-data

  result-object-store:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command:
      - server
      - /data
      - --console-address
      - :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - result-object-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 30
    security_opt:
      - no-new-privileges:true
    networks:
      - result-storage

  result-object-store-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        printf '%s\n%s\n' "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" |
          mc alias set taskgate http://result-object-store:9000
        mc mb --ignore-existing --region "$${GATEWAY_OBJECT_STORE_REGION}" "taskgate/$${GATEWAY_OBJECT_STORE_BUCKET}"
        mc anonymous set none "taskgate/$${GATEWAY_OBJECT_STORE_BUCKET}"
        # Do not install a time-only staging lifecycle: a committed PENDING
        # artifact may still need its staging object for crash recovery.
        while IFS= read -r policy_line || [ -n "$${policy_line}" ]; do
          case "$${policy_line}" in
            *__TASKGATE_RESULT_BUCKET__*)
              policy_prefix=$${policy_line%%__TASKGATE_RESULT_BUCKET__*}
              policy_suffix=$${policy_line#*__TASKGATE_RESULT_BUCKET__}
              printf '%s%s%s\n' "$${policy_prefix}" "$${GATEWAY_OBJECT_STORE_BUCKET}" "$${policy_suffix}"
              ;;
            *) printf '%s\n' "$${policy_line}" ;;
          esac
        done < /config/taskgate-results-policy.json > /tmp/taskgate-results-policy.json
        printf '%s\n%s\n' "$${GATEWAY_OBJECT_STORE_ACCESS_KEY}" "$${GATEWAY_OBJECT_STORE_SECRET_KEY}" |
          mc admin user add taskgate
        mc admin policy create taskgate taskgate-result-artifacts /tmp/taskgate-results-policy.json
        mc admin policy attach taskgate taskgate-result-artifacts --user "$${GATEWAY_OBJECT_STORE_ACCESS_KEY}"
    environment:
      MC_CONFIG_DIR: /tmp/.mc
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      GATEWAY_OBJECT_STORE_ACCESS_KEY: ${GATEWAY_OBJECT_STORE_ACCESS_KEY:?set GATEWAY_OBJECT_STORE_ACCESS_KEY in .env}
      GATEWAY_OBJECT_STORE_SECRET_KEY: ${GATEWAY_OBJECT_STORE_SECRET_KEY:?set GATEWAY_OBJECT_STORE_SECRET_KEY in .env}
      GATEWAY_OBJECT_STORE_BUCKET: ${GATEWAY_OBJECT_STORE_BUCKET:-taskgate-results}
      GATEWAY_OBJECT_STORE_REGION: ${GATEWAY_OBJECT_STORE_REGION:-us-east-1}
    depends_on:
      result-object-store:
        condition: service_healthy
    volumes:
      - ./config/object-store/taskgate-results-policy.json:/config/taskgate-results-policy.json:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    restart: "no"
    security_opt:
      - no-new-privileges:true
    networks:
      - result-storage

  gateway:
    build:
      context: .
      args:
        TARGET: gateway
    environment:
      GATEWAY_ADDR: :8082
      CONTROL_POSTGRES_DSN: postgres://gateway_control:${CONTROL_DB_PASSWORD:?set CONTROL_DB_PASSWORD in .env}@control-postgres:5432/${CONTROL_POSTGRES_DB:-taskbound_gateway}?sslmode=disable
      CATALOG_PATH: /etc/taskbound/catalog.yaml
      # Attested subject attributes for Catalog eligibility predicates. The
      # Gateway refuses to start when the Catalog declares eligibility and this
      # snapshot is absent; a Catalog without eligibility ignores it.
      PRINCIPAL_ATTRIBUTES_PATH: /etc/taskbound/principal-attributes.yaml
      GATEWAY_DATA_KEY: ${GATEWAY_DATA_KEY:?set GATEWAY_DATA_KEY in .env}
      GATEWAY_DATA_KEY_ID: ${GATEWAY_DATA_KEY_ID:-local-aes256-gcm-v1}
      GATEWAY_RECEIPT_KEY_ID: ${GATEWAY_RECEIPT_KEY_ID:?set GATEWAY_RECEIPT_KEY_ID in .env}
      GATEWAY_RECEIPT_PRIVATE_KEY: ${GATEWAY_RECEIPT_PRIVATE_KEY:?set GATEWAY_RECEIPT_PRIVATE_KEY in .env}
      GATEWAY_RECEIPT_KEYRING_JSON: ${GATEWAY_RECEIPT_KEYRING_JSON:-}
      TASKBOUND_ALICE_TOKEN: ${TASKBOUND_ALICE_TOKEN:?set TASKBOUND_ALICE_TOKEN in .env}
      TASKBOUND_CAROL_TOKEN: ${TASKBOUND_CAROL_TOKEN:?set TASKBOUND_CAROL_TOKEN in .env}
      GATEWAY_ADMIN_TOKEN: ${GATEWAY_ADMIN_TOKEN:-}
      # Opens the read-only profile activation diagnostic on the authenticated
      # admin interface. Empty in ordinary deployments.
      TASKGATE_EXPERIMENT_CLASS: ${TASKGATE_EXPERIMENT_CLASS:-}
      # Exact non-publication marker only; empty keeps callback timing disabled.
      TASKGATE_CALLBACK_PHASE_TIMING: ${TASKGATE_CALLBACK_PHASE_TIMING:-}
      GATEWAY_RESULT_RETENTION_TTL: ${GATEWAY_RESULT_RETENTION_TTL:-}
      GATEWAY_RESULT_RETENTION_SWEEP_INTERVAL: ${GATEWAY_RESULT_RETENTION_SWEEP_INTERVAL:-1h}
      GATEWAY_OBJECT_STORE_ENDPOINT: ${GATEWAY_OBJECT_STORE_ENDPOINT:-http://result-object-store:9000}
      GATEWAY_OBJECT_STORE_REGION: ${GATEWAY_OBJECT_STORE_REGION:-us-east-1}
      GATEWAY_OBJECT_STORE_BUCKET: ${GATEWAY_OBJECT_STORE_BUCKET:-taskgate-results}
      GATEWAY_OBJECT_STORE_ACCESS_KEY: ${GATEWAY_OBJECT_STORE_ACCESS_KEY:?set GATEWAY_OBJECT_STORE_ACCESS_KEY in .env}
      GATEWAY_OBJECT_STORE_SECRET_KEY: ${GATEWAY_OBJECT_STORE_SECRET_KEY:?set GATEWAY_OBJECT_STORE_SECRET_KEY in .env}
      GATEWAY_OBJECT_STORE_PATH_STYLE: ${GATEWAY_OBJECT_STORE_PATH_STYLE:-true}
      GATEWAY_PUBLIC_BASE_URL: ${GATEWAY_PUBLIC_BASE_URL:-http://127.0.0.1:8082}
      GATEWAY_DELIVERY_SIGNING_KEY: ${GATEWAY_DELIVERY_SIGNING_KEY:-}
      GATEWAY_RESULT_DELIVERY_TTL: ${GATEWAY_RESULT_DELIVERY_TTL:-5m}
      GATEWAY_RESULT_DOWNLOAD_TIMEOUT: ${GATEWAY_RESULT_DOWNLOAD_TIMEOUT:-30m}
      GATEWAY_RESULT_DOWNLOAD_CONCURRENCY: ${GATEWAY_RESULT_DOWNLOAD_CONCURRENCY:-4}
      GATEWAY_RESULT_PROMOTION_TIMEOUT: ${GATEWAY_RESULT_PROMOTION_TIMEOUT:-30m}
      GATEWAY_RESULT_STAGING_ORPHAN_TTL: ${GATEWAY_RESULT_STAGING_ORPHAN_TTL:-24h}
      GATEWAY_RESULT_TEMP_DIR: ${GATEWAY_RESULT_TEMP_DIR:-/tmp/taskgate-result-artifacts}
      GATEWAY_RESULT_PREVIEW_MAX_BYTES: ${GATEWAY_RESULT_PREVIEW_MAX_BYTES:-67108864}
      GATEWAY_AUDIT_ANCHOR_URL: ${GATEWAY_AUDIT_ANCHOR_URL:-}
      GATEWAY_AUDIT_ANCHOR_INTERVAL: ${GATEWAY_AUDIT_ANCHOR_INTERVAL:-5m}
      GATEWAY_AUDIT_ANCHOR_KEY_ID: ${GATEWAY_AUDIT_ANCHOR_KEY_ID:-}
      GATEWAY_AUDIT_ANCHOR_PRIVATE_KEY: ${GATEWAY_AUDIT_ANCHOR_PRIVATE_KEY:-}
      GATEWAY_SNAPSHOT_ARTIFACT_DIR: /var/lib/taskgate/snapshot-index
      GATEWAY_CONNECTOR_MAX_ROWS: ${GATEWAY_CONNECTOR_MAX_ROWS:-1200000}
      # The code default is 5s, which is a sensible bound for interactive
      # queries but not for the result-heavy Publication: reading 100,000 rows
      # over sixteen fields exceeds it in the database alone, so every wide
      # Artifact cell failed with DATA_CONNECTOR_QUERY_TIMEOUT before it could
      # reach exposure accounting. Ten minutes is the value the exposure-scale
      # attestation path already uses (final-v5-publication-review/review.go).
      # This is a declared governance parameter of the deployment, not a
      # measurement convenience: a longer permitted statement is a larger
      # window in which a single authorized request may draw data.
      GATEWAY_CONNECTOR_STATEMENT_TIMEOUT: ${GATEWAY_CONNECTOR_STATEMENT_TIMEOUT:-10m}
      GATEWAY_CONNECTOR_MAX_CONNECTIONS: ${GATEWAY_CONNECTOR_MAX_CONNECTIONS:-4}
      GATEWAY_CONTROL_MAX_OPEN_CONNECTIONS: ${GATEWAY_CONTROL_MAX_OPEN_CONNECTIONS:-10}
      GATEWAY_CONTROL_MAX_IDLE_CONNECTIONS: ${GATEWAY_CONTROL_MAX_IDLE_CONNECTIONS:-4}
      GATEWAY_CONTROL_CONNECTION_MAX_LIFETIME: ${GATEWAY_CONTROL_CONNECTION_MAX_LIFETIME:-30m}
      # Disabled unless a private campaign token is explicitly supplied.
      # The authenticated probe observes server arrivals/active/queued requests;
      # it never fabricates MCP results and exposes no task/query identities.
      GATEWAY_EVALUATION_CONCURRENCY_TOKEN: ${TASKGATE_FINAL_V5_CONCURRENCY_TOKEN:-}
      # Preserve the full authenticated arrival barrier while admitting only
      # the retained natural-contention cohort into the production handler.
      GATEWAY_EVALUATION_CONCURRENCY_HTTP_ACTIVE: ${GATEWAY_EVALUATION_CONCURRENCY_HTTP_ACTIVE:-10}
      GATEWAY_EVALUATION_CONCURRENCY_HTTP_QUEUE: ${GATEWAY_EVALUATION_CONCURRENCY_HTTP_QUEUE:-512}
      OA_SERVICE_TOKEN: ${OA_SERVICE_TOKEN:?set OA_SERVICE_TOKEN in .env}
      OA_CALLBACK_SECRET: ${OA_CALLBACK_SECRET:?set OA_CALLBACK_SECRET in .env}
      OA_RECEIPT_KEY_ID: ${OA_RECEIPT_KEY_ID:-}
      OA_RECEIPT_PUBLIC_KEY: ${OA_RECEIPT_PUBLIC_KEY:-}
      OA_RECEIPT_KEYRING_JSON: ${OA_RECEIPT_KEYRING_JSON:-}
      OA_BASE_URL: http://oa-demo:8092
      PUBLIC_OA_BASE_URL: http://127.0.0.1:8092
      GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD:?set GATEWAY_DB_PASSWORD in .env}
    depends_on:
      control-postgres:
        condition: service_healthy
      business-postgres:
        condition: service_healthy
      snapshot-index-detail:
        condition: service_completed_successfully
      snapshot-index-summary:
        condition: service_completed_successfully
      snapshot-sidecar-install:
        condition: service_completed_successfully
      result-object-store-init:
        condition: service_completed_successfully
      oa-demo:
        condition: service_healthy
    ports:
      - 127.0.0.1:8082:8082
    volumes:
      # The activated deployment profile Catalog. It defaults to the full
      # Catalog; evaluation/cmd/final-v5-profile-activate points it at exactly
      # one generated profile Catalog so a Catalog-bound Gateway instance
      # activates that closure and nothing else.
      - ${TASKGATE_PROFILE_CATALOG:-./config/catalog.yaml}:/etc/taskbound/catalog.yaml:ro
      # The identity authority's attribute snapshot that eligibility predicates
      # are evaluated against (see docs/catalog-guide.md, Eligibility).
      - ${TASKGATE_PRINCIPAL_ATTRIBUTES:-./config/principal-attributes.yaml}:/etc/taskbound/principal-attributes.yaml:ro
      # Exactly one profile's snapshot artifact directory. It defaults to the
      # shared compiler output; the profile activator points it at a directory
      # holding only the activated closure's publication bundles, because the
      # loader fails closed on any publication the Catalog does not declare.
      - ${TASKGATE_PROFILE_ARTIFACT_DIR:-snapshot-index-artifacts}:/var/lib/taskgate/snapshot-index:ro
      # Adaptive query spools and Parquet upload staging contain only
      # authenticated ciphertext. Keep them on disk: a 16 MiB tmpfs makes the
      # mandatory >128 MiB spill path impossible and would also count against
      # the Gateway's cgroup memory ceiling.
      - gateway-encrypted-spool:/tmp
    read_only: true
    # Cumulative exposure accounting keeps one Fact resident per exposed
    # (row x visible field) for the life of a derivation, so peak RSS tracks
    # the exposed-cell count rather than the serialized result size. Measured
    # across three orders of magnitude, peak ~= 443 MiB + ~3.6 KiB per exposed
    # cell; the widest frozen Artifact cell (100,000 x 16 = 1,600,000 cells)
    # measured 6,607,790,080 B = 6.15 GiB. That memory is live, not garbage --
    # GOMEMLIMIT at 384 MiB and at 224 MiB was measured and still OOM-killed
    # the process, because GC cannot reclaim a growing accounting set.
    #
    # The ceiling is sized for the CAMPAIGN, not for one cell. memory.peak is a
    # cumulative high-water mark and run-deployment.sh forbids restarts, so all
    # nine experiments accumulate in one cgroup; an OOM or any swap invalidates
    # the deployment outright. The Artifact experiment alone, from a fresh
    # Gateway, measured 7,886,876,672 B = 7.35 GiB -- already 91.8% of the
    # former 8g -- and it runs third, after baseline and scale, whose largest
    # derivation carries 1,035,000 Influence facts. 12g keeps ~63% headroom
    # over that measurement while leaving the 25 GiB host enough slack that it
    # never swaps, which a 16g ceiling would not.
    mem_limit: 12g
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8082/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 30
    security_opt:
      - no-new-privileges:true
    networks:
      - public-edge
      - control-plane
      - business-data
      - result-storage

  oa-demo:
    build:
      context: .
      args:
        TARGET: oa-demo
    environment:
      OA_ADDR: :8092
      OA_SERVICE_TOKEN: ${OA_SERVICE_TOKEN:?set OA_SERVICE_TOKEN in .env}
      OA_CALLBACK_SECRET: ${OA_CALLBACK_SECRET:?set OA_CALLBACK_SECRET in .env}
      OA_RECEIPT_KEY_ID: ${OA_RECEIPT_KEY_ID:?set OA_RECEIPT_KEY_ID in .env}
      OA_RECEIPT_PRIVATE_KEY: ${OA_RECEIPT_PRIVATE_KEY:?set OA_RECEIPT_PRIVATE_KEY in .env}
      OA_SESSION_SECRET: ${OA_SESSION_SECRET:?set OA_SESSION_SECRET in .env}
      OA_ALICE_PASSWORD: ${OA_ALICE_PASSWORD:?set OA_ALICE_PASSWORD in .env}
      OA_BOB_PASSWORD: ${OA_BOB_PASSWORD:?set OA_BOB_PASSWORD in .env}
      GATEWAY_CALLBACK_URL: http://gateway:8082/api/v1/oa/callback
      PUBLIC_OA_BASE_URL: http://127.0.0.1:8092
    ports:
      - 127.0.0.1:8092:8092
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8092/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    networks:
      - public-edge

volumes:
  control-pg-data:
  business-pg-data:
  snapshot-index-artifacts:
  gateway-encrypted-spool:
  result-object-data:

networks:
  public-edge:
  control-plane:
  business-data:
    internal: true
  result-storage:
    internal: true

knowledge_products:
  - name: policy_kb
    description: departmental policies, contracts, approvals and reports
    sensitivity: high
    collection: policy_bge_v2
    source_namespace: kb.policy
    products:
      chunks: policy_kb_chunks
      documents: policy_kb_documents
      values: policy_kb_values
    index_publication: policy-kb-2026-10-bge-v2kw
    document_types: ["contract", "approval", "policy", "report"]
    attributes:
      - {name: kb_department, type: enum, scope: kb_department}
      - {name: classification, type: enum, scope: classification}
      - {name: job_role, type: enum, allowed_values: ["director", "executive", "hr", "manager", "staff"]}
      - {name: labels, type: text_set}
      - {name: valid_until, type: date}
    segmentation: {function: section-window-v1, window_chars: 800}
    embedding: {model: bge-m3, dimension: 1024, weights_sha256: b5e0ce3470abf5ef3831aa1bd5553b486803e83251590ab7ff35a117cf6aad38}
    extraction_rules:
      - {document_type: contract, field: amount, type: numeric, source: frontmatter, scope: document}
      - {document_type: contract, field: counterparty, type: text, source: frontmatter, scope: document}
      - {document_type: contract, field: signed_on, type: date, source: frontmatter, scope: document}
      - {document_type: approval, field: approved_amount, type: numeric, source: frontmatter, scope: document}
      - {document_type: policy, field: effective_on, type: date, source: frontmatter, scope: document}
      - {document_type: report, field: headline_metric, type: numeric, source: frontmatter, scope: document}
    retrieval: {k_max: 20, exact: true, aggregates: [count, sum, min, max], generation_admitted: false, keyword: true}
    scopes: [kb_department, classification]
    eligibility:
      scope_envelope:
        kb_department:
          from_attribute: department
          widen_if:
            - {attribute: job_family, any_of: [finance_controller]}
        classification:
          from_attribute: clearance

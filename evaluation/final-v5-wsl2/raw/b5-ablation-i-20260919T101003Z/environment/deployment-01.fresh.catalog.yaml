approval_routes:
  # The reviewed Catalog candidate routes every benchmark low Product through
  # one default low ceiling and pins only expense_summary narrow; this Catalog
  # now has the same shape. The one deliberate divergence is the row ceiling:
  # the candidate grants 100,000, but max_rows is a cumulative per-Task ledger
  # (internal/control/budget.go charges settlement.Rows into used_rows on every
  # completed query) and one Baseline Task carries a cell's novel query plus its
  # three replays. Baseline S1/SF10 therefore settles 4 x 50,000 rows on one
  # Task, and the candidate's ceiling refused its third governed query in a real
  # run on 2026-08-16. The ceiling here is sized from that measurement.
  - sensitivity: low
    mode: manual
    approver: bob
    budget_profile: final-v5-baseline-low-v1
  # One deliberate divergence from the reviewed candidate, which pins
  # expense_summary to its own scoped route. Scoping a Product makes it
  # exclusive: exact-set matching means a Product named by a scoped route can
  # only ever be requested as exactly that set, so scoping expense_summary
  # would stop it being requested together with expense_detail. That
  # combination is a task-to-data capability the Gateway is built around, and
  # it outweighs keeping a demo aggregate on a five-hundred-row ceiling.
  # expense_summary therefore shares the default low route. A delegated grant
  # still intersects with its parent, so the widening only reaches a root task
  # that requests the summary alone.
  - sensitivity: medium
    mode: manual
    approver: bob
    budget_profile: detail-manual-v5
  - sensitivity: high
    mode: manual
    approver: bob
    budget_profile: detail-manual-v5
  - sensitivity: medium
    products: [final_v5_attack_expense_detail]
    mode: manual
    approver: bob
    budget_profile: final-v5-attack-medium-v1
  - sensitivity: medium
    products: [final_v5_concurrency_expense_detail]
    mode: manual
    approver: bob
    budget_profile: final-v5-concurrency-v1
  - sensitivity: medium
    products: [final_v5_rls_unlimited_expense_detail]
    mode: manual
    approver: bob
    budget_profile: final-v5-rls-unlimited-v1
  - sensitivity: medium
    products: [final_v5_rls_bounded_expense_detail]
    mode: manual
    approver: bob
    budget_profile: final-v5-rls-bounded-70-v1
  # The default low route keeps its historical summary budget. The frozen
  # Artifact cells need the reviewed benchmark ceiling, so result-heavy gets an
  # exact product-scoped manual OA route instead of widening every low Product.
  - sensitivity: low
    products: [final_v5_result_heavy]
    mode: manual
    approver: bob
    budget_profile: final-v5-benchmark-low-v1
  - sensitivity: low
    products: [final_v5_footprint_unlimited_result_heavy]
    mode: manual
    approver: bob
    budget_profile: final-v5-footprint-unlimited-v1
  - sensitivity: low
    products: [final_v5_footprint_bounded_result_heavy]
    mode: manual
    approver: bob
    budget_profile: final-v5-footprint-bounded-v1
  - sensitivity: low
    products: [final_v5_exposure_scale]
    mode: manual
    approver: bob
    budget_profile: final-v5-exposure-scale-v1
budget_profiles:
  - name: summary-manual-v5

# B5 arm (i) exposure-free twin of config/catalog.yaml, generated by evaluation/cmd/b5-catalogs.
# Same sources, scopes, products, operators, routes and resource budgets; no snapshot
# publications, no product snapshot_publication, no fact limits, no exposure profile.
# Evaluation-owned; never a production or profile-registry catalog.
catalog_version: "2026-08-02.stage-b-v1"
sources:
  - name: travel_demo
    datasource_id: taskgate-demo-travel
    type: postgres
    address: business-postgres
    port: 5432
    database: travel_demo
    user: gateway_reader
    postgres_major_version: 16
    # Live attested reporting-view digest. Adding the Final-V5 result-heavy
    # Product changes the source attestation, so it was regenerated with
    # evaluation/cmd/schema-digest against a fresh deployment.
    schema_digest: f9dcd0b0663ef7ea0422a4ed8626325da91fa62e5e304782974428797418ac48
    secretRef: GATEWAY_DB_PASSWORD
scopes:
  - name: department
    type: enum
    description: 任务获批后允许访问的部门范围
    allowed_values: [销售部, 研发部, 财务部]
  - name: expense_date
    type: date_range
    description: 报销发生日期范围
    min: "2026-01-01"
    max: "2026-12-31"
  - name: partition_key
    type: enum
    description: Final-V5 ProvSQL 冻结分区键
    allowed_values: ["1"]
  - name: category
    type: enum
    description: Final-V5 result-heavy complete category domain
    allowed_values: [alpha, beta, gamma, delta]
  # S4's semantic View exposes each side's partition key as its own public
  # scope, because a View's scopes must be columns an approved task can bind
  # and the join carries two of them.
  - name: orders_partition_key
    type: enum
    description: Final-V5 depth-4 View 的订单侧分区键
    allowed_values: ["1"]
  - name: lineitem_partition_key
    type: enum
    description: Final-V5 depth-4 View 的明细侧分区键
    allowed_values: ["1"]

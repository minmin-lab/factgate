  # analytics Product. Sized for the largest Task any of them settles: Baseline
  # S1/SF10 releases 50,000 rows on each of four governed queries.
  - name: final-v5-baseline-low-v1
    max_queries: 128
    max_rows: 400000
    max_db_time: 30m
    query_timeout: 30m
    task_ttl: 2h
    max_release_facts: 2000000
    max_influence_facts: 8000000
    max_outcome_facts: 128
    exposure_profile_version: taskgate-exposure-v5
    # The predicate footprint is deliberately identical to summary-manual-v5's
    # rather than to the retired ProvSQL profile's. expense_summary shares this
    # route, and a delegated task must have a footprint within its parent
    # grant's, so a wider one here would refuse every delegation issued under
    # the summary footprint. Nine unique atoms is ample: every retained sample
    # in this repository recorded a predicate_atom_count of five or fewer.
    predicate_footprint:
      version: taskgate-predicate-footprint-v1
      max_raw_literals_per_query: 1000
      max_unique_atoms_per_query: 9
      max_atom_payload_bytes: 4096
      max_total_atom_payload_bytes: 36864
